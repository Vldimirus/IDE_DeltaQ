name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux-build-test:
    name: Linux Build And Test
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen
      CTEST_OUTPUT_ON_FAILURE: 1
      CI_WORKSPACE: build/ci-linux
      CMAKE_BUILD_DIR: build/ci-linux/cmake
      INSTALL_SMOKE_DIR: build/ci-linux/install-smoke
      PACKAGE_DIR: build/ci-linux/package

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            qt6-base-dev \
            qt6-tools-dev-tools \
            libqscintilla2-qt6-dev \
            libclang-dev \
            libsdl2-dev \
            libsdl2-ttf-dev

      - name: Configure
        run: cmake --preset ci-linux

      - name: Build
        run: cmake --build --preset ci-linux --parallel

      - name: Test
        run: ctest --preset ci-linux

      - name: Install bundle smoke
        run: cmake --install "$CMAKE_BUILD_DIR" --prefix "$INSTALL_SMOKE_DIR"

      - name: Verify bundle layout
        run: ./scripts/verify_release_bundle.sh "$INSTALL_SMOKE_DIR"

      - name: First-run smoke
        run: ./scripts/smoke_linux_first_run.sh "$INSTALL_SMOKE_DIR"

      - name: Example build/run smoke
        run: ./scripts/smoke_linux_example_build_run.sh "$INSTALL_SMOKE_DIR"

      - name: Example export smoke
        run: ./scripts/smoke_linux_example_export.sh "$INSTALL_SMOKE_DIR"

      - name: Package smoke
        run: cpack --config "$CMAKE_BUILD_DIR/CPackConfig.cmake" -B "$PACKAGE_DIR"

      - name: AppDir smoke
        run: ./scripts/build_appimage.sh --no-tests --appdir-only

      - name: Generate package checksums
        run: |
          cd "$PACKAGE_DIR"
          sha256sum *.tar.gz > SHA256SUMS

      - name: Verify package artifact
        run: |
          ls -1 "$PACKAGE_DIR"/*.tar.gz
          ./scripts/verify_package_archive.sh "$PACKAGE_DIR"/*.tar.gz "$PACKAGE_DIR/SHA256SUMS"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: deltaq-linux-package
          path: |
            build/ci-linux/package/*.tar.gz
            build/ci-linux/package/SHA256SUMS

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-failure-logs
          path: |
            build/ci-linux/cmake/Testing/**/*
            build/ci-linux/cmake/CMakeFiles/CMakeOutput.log
            build/ci-linux/cmake/CMakeFiles/CMakeError.log
